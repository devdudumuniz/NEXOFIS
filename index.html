<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <title>NEXOFIS — Inteligência sobre o gasto público</title>
    <meta
      name="description"
      content="Plataforma open-source (AGPL-3.0) de auditoria forense de contratos públicos brasileiros com resolução IBGE, integração PNCP, motor híbrido de OCR e trilha probatória reproduzível."
    />
    <meta property="og:title" content="NEXOFIS — Inteligência sobre o gasto público" />
    <meta
      property="og:description"
      content="Auditoria forense reproduzível e priorizada de contratos públicos brasileiros com proveniência verificável."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        background-color: #faf9f5;
        color: #0b2540;
      }
      html.dark,
      html.dark body {
        background-color: #061321;
        color: #faf9f5;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nexofis:theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            stored === 'dark' || stored === 'light'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.dataset.theme = resolved;
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            root.style.backgroundColor = '#061321';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            root.style.backgroundColor = '#FAF9F5';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F5] text-[#0B2540] dark:bg-[#061321] dark:text-[#FAF9F5] antialiased selection:bg-[#E8F1F6] selection:text-[#0B2540] dark:selection:bg-[#D95B35]/30 dark:selection:text-[#FAF9F5]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
