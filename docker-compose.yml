services:
  # ============================================================================
  # Perfil padrão (standalone): NEXOFIS com SQLite WAL + extrator nativo de PDF
  #   docker compose up --build -d
  #
  # Perfil completo com OCR distribuído (Docling Serve + PaddleOCR) e Postgres:
  #   docker compose --profile full-ocr --profile postgres up --build -d
  # ============================================================================

  nexofis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexofis-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - nexofis_sqlite_data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXOFIS_DB_DRIVER: ${NEXOFIS_DB_DRIVER:-sqlite}
      NEXOFIS_SQLITE_PATH: /app/data/nexofis.db
      NEXOFIS_JOBS_DB_PATH: /app/data/nexofis-jobs.db
      DATABASE_URL: ${DATABASE_URL:-}
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-}
      PADDLE_OCR_URL: ${PADDLE_OCR_URL:-}
      # Em produção a autenticação é fail-closed por padrão.
      # Defina NEXOFIS_SESSION_SECRET (>= 32 chars) ou NEXOFIS_ALLOW_INSECURE_LOCAL=true apenas em rede isolada.
      NEXOFIS_AUTH_ENABLED: ${NEXOFIS_AUTH_ENABLED:-true}
      NEXOFIS_ALLOW_INSECURE_LOCAL: ${NEXOFIS_ALLOW_INSECURE_LOCAL:-false}
      NEXOFIS_SESSION_SECRET: ${NEXOFIS_SESSION_SECRET:?Defina NEXOFIS_SESSION_SECRET (>= 32 chars) no .env}
      PORTAL_TRANSPARENCIA_API_KEY: ${PORTAL_TRANSPARENCIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => r.json()).then(d => process.exit(d && d.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  docling-serve:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: nexofis-docling
    profiles: ["full-ocr"]
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  paddleocr-worker:
    build:
      context: ./app/worker
      dockerfile: Dockerfile
    container_name: nexofis-paddleocr
    profiles: ["full-ocr"]
    restart: unless-stopped
    environment:
      OCR_WORKER_PORT: "8090"
      PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-pt}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-60}
      OCR_WORKERS: ${OCR_WORKERS:-4}
      OCR_DEFAULT_DPI: ${OCR_DEFAULT_DPI:-180}
    ports:
      - "${PADDLE_OCR_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: nexofis-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexofis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-nexofis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexofis_pgdata:/var/lib/postgresql/data
      - ./app/backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexofis} -d ${POSTGRES_DB:-nexofis}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexofis_pgdata:
  nexofis_sqlite_data:
