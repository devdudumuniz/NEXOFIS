services:
  postgres:
    image: postgres:16-alpine
    container_name: nexofis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexofis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexofis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexofis_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexofis} -d ${POSTGRES_DB:-nexofis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  docling-serve:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: nexofis-docling
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  paddleocr-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: nexofis-paddleocr
    restart: unless-stopped
    environment:
      OCR_WORKER_PORT: "8090"
      PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-pt}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-60}
      OCR_WORKERS: ${OCR_WORKERS:-4}
      OCR_DEFAULT_DPI: ${OCR_DEFAULT_DPI:-180}
    ports:
      - "${PADDLE_OCR_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  nexofis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexofis-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docling-serve:
        condition: service_started
      paddleocr-worker:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - nexofis_sqlite_data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXOFIS_DB_DRIVER: ${NEXOFIS_DB_DRIVER:-sqlite}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexofis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexofis}
      DOCLING_SERVE_URL: http://docling-serve:5001
      PADDLE_OCR_URL: http://paddleocr-worker:8090
      NEXOFIS_AUTH_ENABLED: ${NEXOFIS_AUTH_ENABLED:-false}
      NEXOFIS_SESSION_SECRET: ${NEXOFIS_SESSION_SECRET:-}
      PORTAL_TRANSPARENCIA_API_KEY: ${PORTAL_TRANSPARENCIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  nexofis_pgdata:
  nexofis_sqlite_data:
