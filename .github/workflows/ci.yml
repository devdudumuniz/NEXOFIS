name: NEXOFIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck (lint)
        run: npm run lint

      - name: Run unit and audit regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Real HTTP API smoke test (production fail-closed auth + persistence)
        run: npx tsx scripts/smoke-api.ts
