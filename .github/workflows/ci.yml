name: NEXOFIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (lint)
        run: pnpm run lint

      - name: Run unit and audit regression tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: Real HTTP API smoke test (production fail-closed auth + persistence)
        run: pnpm run smoke
