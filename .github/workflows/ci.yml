name: NEXOFIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and regression tests
        run: node --import tsx --test src/lib/*.test.ts

      - name: Typecheck (lint)
        run: npm run lint

      - name: Production build
        run: npm run build
